[project]
name = "recon-lite-hector"
version = "0.1.0"
description = "Hector chess experiments built on the ReCoN Lite core"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "recon-lite",
    "python-chess>=1.999",
    "numpy>=1.20.0",
    "torch>=2.0.0",
    "pytest>=8.4.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["recon_lite_chess*", "recon_lite_hector*"]

[tool.uv.workspace]
members = ["libs/recon-lite"]

[tool.uv.sources]
recon-lite = { workspace = true }

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "libs/recon-lite/tests",
]
